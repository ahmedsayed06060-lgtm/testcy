name: cyberops-hub-prod
services:
  traefik:
    image: traefik:v3.3
    command: ["--providers.docker=true", "--providers.docker.exposedbydefault=false", "--entrypoints.web.address=:80", "--entrypoints.web.http.redirections.entrypoint.to=websecure", "--entrypoints.web.http.redirections.entrypoint.scheme=https", "--entrypoints.websecure.address=:443", "--certificatesresolvers.le.acme.email=${ACME_EMAIL}", "--certificatesresolvers.le.acme.storage=/acme/acme.json", "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"]
    ports: ["80:80", "443:443"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro", "traefik-acme:/acme"]
    restart: unless-stopped
    networks: [public]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ${POSTGRES_USER}, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}, POSTGRES_DB: ${POSTGRES_DB} }
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10 }
    networks: [private]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 10 }
    networks: [private]
  minio:
    image: minio/minio:latest
    command: server /data
    environment: { MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}, MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY} }
    volumes: ["minio-data:/data"]
    restart: unless-stopped
    networks: [private]
  clamav:
    image: clamav/clamav:1.4
    volumes: ["clamav-data:/var/lib/clamav"]
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "clamdscan --ping 3 --wait 60 /dev/null"], interval: 30s, timeout: 65s, retries: 10 }
    networks: [private]
  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    env_file: .env
    environment: { ENVIRONMENT: production, DATABASE_URL: ${DATABASE_URL}, REDIS_URL: ${REDIS_URL}, JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key, JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key, CLAMAV_HOST: clamav, PUBLIC_API_URL: https://${DOMAIN}/api/v1 }
    secrets: [jwt_private_key, jwt_public_key]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, clamav: { condition: service_healthy } }
    restart: unless-stopped
    labels: ["traefik.enable=true", "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || Path(`/healthz`))", "traefik.http.routers.api.entrypoints=websecure", "traefik.http.routers.api.tls.certresolver=le", "traefik.http.services.api.loadbalancer.server.port=8000"]
    networks: [public, private]
  celery-worker:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    env_file: .env
    environment: { TOOL_OUTPUT_VOLUME: cyberops-hub-prod_scan-output, TOOL_DOCKER_NETWORK: cyberops-hub-prod_cyberops-egress }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "scan-output:/output"]
    depends_on: [postgres, redis, minio]
    restart: unless-stopped
    networks: [private, cyberops-egress]
  celery-beat:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=INFO"]
    env_file: .env
    depends_on: [postgres, redis]
    restart: unless-stopped
    networks: [private]
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1 } }
    environment: { NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1 }
    depends_on: [backend]
    restart: unless-stopped
    labels: ["traefik.enable=true", "traefik.http.routers.web.rule=Host(`${DOMAIN}`)", "traefik.http.routers.web.entrypoints=websecure", "traefik.http.routers.web.tls.certresolver=le", "traefik.http.services.web.loadbalancer.server.port=3000"]
    networks: [public, private]
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    environment: { MOBSF_API_KEY: ${MOBSF_API_KEY} }
    restart: unless-stopped
    networks: [private]
volumes: { postgres-data: {}, redis-data: {}, minio-data: {}, clamav-data: {}, scan-output: {}, traefik-acme: {} }
networks: { public: { driver: bridge }, private: { driver: bridge }, cyberops-egress: { driver: bridge } }
secrets:
  jwt_private_key: { file: ./backend/keys/jwt_private_key.pem }
  jwt_public_key: { file: ./backend/keys/jwt_public_key.pem }
