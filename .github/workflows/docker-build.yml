name: Build and publish images
on: { push: { tags: ['v*'] } }
permissions: { contents: read, packages: write }
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, context: backend, dockerfile: Dockerfile }
          - { name: worker, context: backend, dockerfile: Dockerfile.worker }
          - { name: frontend, context: frontend, dockerfile: Dockerfile }
          - { name: nmap, context: tool-images/nmap, dockerfile: Dockerfile }
          - { name: testssl, context: tool-images/testssl, dockerfile: Dockerfile }
          - { name: nuclei, context: tool-images/nuclei, dockerfile: Dockerfile }
          - { name: zap, context: tool-images/zap, dockerfile: Dockerfile }
          - { name: mobsf, context: tool-images/mobsf, dockerfile: Dockerfile }
          - { name: osint, context: tool-images/osint, dockerfile: Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - id: meta
        uses: docker/metadata-action@v5
        with: { images: ghcr.io/${{ github.repository }}/cyberops-${{ matrix.name }}, tags: type=semver,pattern={{version}} }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
