name: CI
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberops
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: cyberops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U cyberops -d cyberops_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e '.[dev]'
      - run: ruff check app tests alembic && ruff format --check app tests alembic
      - run: mypy app
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://cyberops:ci-database-only@localhost:5432/cyberops_test
      - name: Create a non-superuser role for RLS integration tests
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  'postgresql://cyberops:ci-database-only@localhost:5432/cyberops_test'
              )
              await connection.execute(
                  "CREATE ROLE rls_test LOGIN PASSWORD 'ci-rls-test-only'"
              )
              await connection.execute('GRANT USAGE ON SCHEMA public TO rls_test')
              await connection.execute(
                  'GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO rls_test'
              )
              await connection.close()

          asyncio.run(main())
          PY
      - run: pytest --cov=app --cov-report=xml --cov-report=term-missing
        env:
          POSTGRES_TEST_URL: postgresql://rls_test:ci-rls-test-only@localhost:5432/cyberops_test
      # Reports disable presentational hints and all resource fetching, so
      # PYSEC-2026-3412's <body background> CSS-injection path is unreachable.
      - run: pip-audit --ignore-vuln PYSEC-2026-3412
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage.xml }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - run: npm audit --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, exit-code: '1', ignore-unfixed: true }
